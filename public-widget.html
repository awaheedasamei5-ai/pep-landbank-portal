<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Palmstead — live activity</title>
<style>
  :root{
    --ink:#1E1B4B; --green:#4F46E5; --leaf:#818CF8; --gold:#A78BFA;
    --paper:#F5F5FB; --text:#1B1A33; --muted:#68678A;
    --flame1:#F59E0B; --flame2:#D97706;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:transparent;
  }
  .pwCard{
    position:relative; overflow:hidden; border-radius:22px; padding:22px 24px;
    background:linear-gradient(135deg,var(--ink) 0%,var(--green) 55%,var(--leaf) 100%);
    color:#fff; box-shadow:0 20px 44px -14px rgba(30,27,75,.5);
    max-width:520px;
  }
  .pwCard::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 88% -15%,rgba(129,140,248,.4),transparent 55%);
  }
  .pwTop{position:relative; z-index:1; display:flex; align-items:center; gap:10px; margin-bottom:16px}
  .pwLogo{width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-size:15px; padding:4px; overflow:hidden}
  .pwBrand{font-weight:700; font-size:14px; letter-spacing:.08em; text-transform:uppercase}
  .pwAgentName{font-weight:700; font-size:14px}
  .pwLive{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:10.5px; color:rgba(255,255,255,.75); font-weight:700; letter-spacing:.04em}
  .pwDot{width:6px; height:6px; border-radius:50%; background:#4ADE80; animation:pwPulse 1.8s infinite}
  @keyframes pwPulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* Personalized "Duolingo streak card" hero -- a big flame + number is the
     single most recognizable pattern from Duolingo's own streak widget, so
     the personalized view leads with it instead of burying it in a stat grid. */
  .pwStreakHero{position:relative; z-index:1; display:flex; align-items:center; gap:16px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:18px;
    padding:16px 18px; margin-bottom:14px}
  .pwFlame{width:52px; height:52px; flex:0 0 auto; display:block; filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));
    animation:pwFlameMotion 3.2s ease-in-out infinite}
  @keyframes pwFlameMotion{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    25%{transform:translateY(-4px) rotate(-4deg) scale(1.04)}
    50%{transform:translateY(-7px) rotate(0deg) scale(1.08)}
    75%{transform:translateY(-4px) rotate(4deg) scale(1.04)}
  }
  .pwStreakNum{font-family:'IBM Plex Mono',ui-monospace,monospace; font-weight:800; font-size:34px; line-height:1}
  .pwStreakLbl{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.75); font-weight:700; margin-top:4px}

  .pwStats{position:relative; z-index:1; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px}
  .pwStat{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:12px 10px; text-align:center}
  .pwStatVal{font-family:'IBM Plex Mono',ui-monospace,monospace; font-weight:800; font-size:22px; line-height:1}
  .pwStatLbl{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,255,255,.7); margin-top:6px; font-weight:700}
  .pwCta{
    position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:rgba(255,255,255,.95); color:var(--ink); border-radius:100px; padding:10px 8px 10px 16px;
  }
  .pwCtaText{font-size:12.5px; font-weight:700}
  .pwCtaBtn{
    background:linear-gradient(135deg,var(--green),var(--gold)); color:#fff; border:none; border-radius:100px;
    padding:9px 16px; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap;
  }
  .pwSkel{opacity:.35}
  .pwErr{font-size:11px; color:rgba(255,255,255,.7); text-align:center; margin-top:4px; position:relative; z-index:1}
</style>
</head>

  function animateCount(el, to){
    var from = 0;
    var start = null;
    var dur = 900;
    function step(ts){
      if(!start) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * eased).toLocaleString();
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function paintError(){
    document.getElementById('pwErr').style.display = 'block';
  }

  function ghsShort(n){
    n = Number(n) || 0;
    if(n >= 1000000) return 'GHS ' + (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
    if(n >= 1000) return 'GHS ' + (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
    return 'GHS ' + n.toLocaleString();
  }

  function paintPersonalized(d){
    document.getElementById('pwBrandLabel').textContent = d.agentName || 'Palmstead';
    document.getElementById('pwStreakHero').style.display = 'flex';
    document.getElementById('pwFlameImg').src = FIRE_IMG;
    animateCount(document.getElementById('pwStreakNum'), d.streakLen || 0);
    document.getElementById('pwStreakLbl').textContent = (d.streakLen === 1 ? 'day streak' : 'day streak');
    document.getElementById('pwClientsLbl').textContent = 'Pipeline value';
    document.getElementById('pwSoldLbl').textContent = 'Clients this month';
    ['pwClients','pwSold','pwVisits'].forEach(function(id){
      document.getElementById(id).classList.remove('pwSkel');
    });
    document.getElementById('pwClients').textContent = ghsShort(d.pipelineValue);
    document.getElementById('pwSold').textContent = (d.clientsThisMonth || 0).toLocaleString();
    animateCount(document.getElementById('pwVisits'), d.siteVisitsThisWeek || 0);
    document.getElementById('pwCtaText').textContent = 'Keep the streak going';
  }

  function paintCompanyWide(d){
    animateCount(document.getElementById('pwClients'), d.totalClients || 0);
    animateCount(document.getElementById('pwSold'), d.plotsSoldThisMonth || 0);
    animateCount(document.getElementById('pwVisits'), d.siteVisitsThisWeek || 0);
    ['pwClients','pwSold','pwVisits'].forEach(function(id){
      document.getElementById(id).classList.remove('pwSkel');
    });
  }

  function fetchStats(){
    var url = STATS_URL + (AGENT_TOKEN ? ('?agent=' + encodeURIComponent(AGENT_TOKEN)) : '');
    fetch(url, { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !d.ok) throw new Error('bad response');
        document.getElementById('pwErr').style.display = 'none';
        if(d.personalized) paintPersonalized(d); else paintCompanyWide(d);
      })
      .catch(paintError);
  }

  document.getElementById('pwCtaBtn').onclick = function(){
    window.open(PORTAL_URL, '_blank', 'noopener');
  };

  fetchStats();
  setInterval(fetchStats, POLL_MS);
</script>
